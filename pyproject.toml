[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmkt"
version = "0.1.1"
description = "Read-only prediction-market data infrastructure for Polymarket and Kalshi"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "pmkt contributors"}]
maintainers = [{name = "pmkt contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "httpx>=0.26",
  "pydantic>=2.0",
  "tenacity>=8.0",
  "aiolimiter>=1.1.0",
  "typer>=0.9.0",
  "pydantic-settings>=2.0",
]


[project.scripts]
pmkt = "pmkt.cli.entrypoint:main"

[project.optional-dependencies]
data = [
  "pandas>=2.1,<3",
  "pyarrow>=14",
  "duckdb>=1.0",
]
storage = [
  "pandas>=2.1,<3",
  "pyarrow>=14",
  "duckdb>=1.0",
]
streaming = [
  "pandas>=2.1,<3",
  "pyarrow>=14",
  "websockets>=12.0",
]
test = [
  "pandas>=2.1,<3",
  "numpy>=1.26,<2.5",
  "pyarrow>=14",
  "duckdb>=1.0",
  "websockets>=12.0",
  "build>=1.2",
  "setuptools>=68",
  "wheel",
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  # Pinned below 0.16: that release enables rules (FURB157, UP045, E712, I001,
  # UP035, E402, ...) that flag ~1500 pre-existing violations repo-wide. Adopting
  # 0.16 is its own change; keep the linter from floating into a red CI in the
  # meantime.
  "ruff>=0.15,<0.16",
  "mypy>=1.8",
  "types-setuptools",
]

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pmkt = [
  "_build_info.json",
  "py.typed",
  "text/taxonomy_data/*.json",
]
