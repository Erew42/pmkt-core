[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "build_support"
backend-path = ["."]

[project]
name = "pmkt"
version = "0.2.0"
description = "Read-only prediction-market data infrastructure for Polymarket and Kalshi"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "pmkt contributors"}]
maintainers = [{name = "pmkt contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "httpx>=0.26",
  "pydantic>=2.0",
  "tenacity>=8.0",
  "aiolimiter>=1.1.0",
  "typer>=0.9.0",
  "pydantic-settings>=2.0",
  "tzdata>=2026.3",
]


[project.scripts]
pmkt = "pmkt.cli.entrypoint:main"

[project.optional-dependencies]
# DuckDB 2 changes SELECT classification and disables the catalog's arrow lambdas.
# Qualify that major separately before allowing it in data, storage, or tests.
data = [
  "pandas>=2.1,<3",
  "pyarrow>=14",
  "duckdb>=1.5.5,<2",
]
storage = [
  "pandas>=2.1,<3",
  "pyarrow>=14",
  "duckdb>=1.5.5,<2",
]
streaming = [
  "pandas>=2.1,<3",
  "pyarrow>=14",
  "websockets>=15.0",
]
uvloop = [
  "uvloop>=0.21; sys_platform != 'win32'",
]
test = [
  "pandas>=2.1,<3",
  "numpy>=1.26,<2.5",
  "pyarrow>=14",
  "duckdb>=1.5.5,<2",
  "websockets>=15.0",
  "build>=1.2",
  "maturin>=1.7,<2",
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  # Pinned below 0.16: that release enables rules (FURB157, UP045, E712, I001,
  # UP035, E402, ...) that flag ~1500 pre-existing violations repo-wide. Adopting
  # 0.16 is its own change; keep the linter from floating into a red CI in the
  # meantime.
  "ruff>=0.15,<0.16",
  "mypy>=1.8",
]

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.maturin]
python-source = "src"
module-name = "pmkt._native"
manifest-path = "crates/pmkt-py/Cargo.toml"
features = ["pyo3/extension-module"]
locked = true
include = [
  { path = "build_support.py", format = "sdist" },
  { path = "Cargo.toml", format = "sdist" },
  { path = "Cargo.lock", format = "sdist" },
  { path = "crates/**/*", format = "sdist" },
  { path = "tests/fixtures/kalshi_orderbook_*.json", format = "sdist" },
  { path = "tests/fixtures/raw_capture/*.jsonl.gz", format = "sdist" },
  { path = "docs/data_dictionary.md", format = "sdist" },
]
# Maturin includes the Python package (including py.typed and taxonomy JSON).
exclude = [
  "**/__pycache__/**", "**/*.pyc", "src/pmkt/_build_info.json",
  { path = "src/pmkt/_native*.so", format = "sdist" },
  { path = "src/pmkt/_native*.pyd", format = "sdist" },
]
