name: tests

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - run: python scripts/check_repo_hygiene.py
      - run: python scripts/check_pytest_lane_coverage.py .github/workflows/tests.yml tests
      - run: python -m ruff check .
      - run: python -m mypy src

  pytest-lanes:
    name: pytest (${{ matrix.python-version }}, ${{ matrix.lane.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        lane:
          - name: foundations-packaging
            paths: >-
              tests/test_config.py
              tests/test_extras_boundaries.py
              tests/test_http.py
              tests/test_import_isolation.py
              tests/test_imports.py
              tests/test_models.py
              tests/test_public_boundary.py
              tests/test_provenance.py
              tests/test_repo_hygiene.py
              tests/test_source_archive_builder.py
              tests/test_time.py
              tests/test_wheel_contents.py
          - name: data-api-schema-resolution
            paths: >-
              tests/test_book_schemas.py
              tests/test_canonical_schemas.py
              tests/test_clob.py
              tests/test_contract_evidence.py
              tests/test_contract_evidence_integration.py
              tests/test_derive_market_snapshots_from_raw_json.py
              tests/test_drift_scripts_offline.py
              tests/test_duckdb_storage.py
              tests/test_features.py
              tests/test_gamma.py
              tests/test_grouping.py
              tests/test_historical_books.py
              tests/test_io.py
              tests/test_kalshi.py
              tests/test_market_catalog.py
              tests/test_market_data.py
              tests/test_normalize.py
              tests/test_openapi_params.py
              tests/test_polymarket_data_api.py
              tests/test_recorder.py
              tests/test_resolution.py
              tests/test_resolution_cache.py
              tests/test_resolution_terminal_labels.py
              tests/test_run_manifests.py
              tests/test_schema_lifecycle.py
              tests/test_schema_registry_validation.py
              tests/test_structure_discovery.py
              tests/test_taxonomy_evidence.py
              tests/test_venue_adapter.py
          - name: feeds-streaming
            paths: >-
              tests/test_capture_storage_backends.py
              tests/test_connection_partitions.py
              tests/test_cr18_9_capture_completeness.py
              tests/test_cr18_book_reconstruction.py
              tests/test_cr18_foundations.py
              tests/test_cr18_health_emission.py
              tests/test_cr18_instrument_evidence.py
              tests/test_cr18_observations.py
              tests/test_cr18_tape_durability.py
              tests/test_cr18_topbook_emission.py
              tests/test_feed_control.py
              tests/test_kalshi_integration.py
              tests/test_kalshi_order_book_stream.py
              tests/test_kalshi_ws.py
              tests/test_live_feed_supervisor.py
              tests/test_order_book_stream.py
              tests/test_streaming_collector.py
              tests/test_streaming_measurement.py
              tests/test_ws_transport.py
              tests/test_ws.py
          - name: cli
            paths: >-
              tests/test_cli.py
              tests/test_cr18_cli_profiles.py
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - run: python -m pytest -q --durations=25 ${{ matrix.lane.paths }}

  pytest-lanes-gate:
    name: pytest-lanes-gate
    runs-on: ubuntu-latest
    needs: pytest-lanes
    if: ${{ always() }}
    steps:
      - name: Require every test lane
        run: |
          if [ "${{ needs.pytest-lanes.result }}" != "success" ]; then
            echo "pytest-lanes result: ${{ needs.pytest-lanes.result }}"
            exit 1
          fi

  packaging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build "setuptools>=68" wheel pytest
          python -m build
      - name: Install wheel away from the checkout
        run: |
          cd "${RUNNER_TEMP}"
          python -m pip install --force-reinstall "${GITHUB_WORKSPACE}"/dist/*.whl
          python -c "import pmkt, pmkt.data.canonical, pmkt.streaming, pmkt.resolution, pmkt.text.taxonomy"
          python -c "import importlib.util; assert importlib.util.find_spec('pmkt.execution') is None; assert importlib.util.find_spec('pmkt_trading') is None"
          pmkt --help
          python -m pip install "pmkt[data]==0.1.1"
      - name: Inspect distribution boundary
        run: python -m pytest -q tests/test_wheel_contents.py
